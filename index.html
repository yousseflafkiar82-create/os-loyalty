<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O&S Loyalty</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;padding:16px}
header{text-align:center;border-bottom:1px solid #b99750;padding:20px}
h1{color:#d6b66c;letter-spacing:4px;font-size:38px}
.card{background:#202020;padding:18px;border-radius:14px;margin:18px 0}
input{width:100%;padding:14px;margin:7px 0;background:#333;color:white;border:1px solid #777;border-radius:8px}
button{padding:13px;background:#c6a45b;color:#111;border:0;border-radius:8px;font-weight:bold;margin:5px;cursor:pointer}
.secondary{background:#444;color:white}
.customer{border-bottom:1px solid #555;padding:15px 0}
.hidden{display:none}
.qrbox{background:white;padding:12px;display:inline-block;border-radius:10px;margin:10px 0}
#reader{width:100%;max-width:400px;margin:15px auto}
small{color:#bbb}
</style>
</head>
<body>
<header>
<h1>O&S</h1>
<p>PELUQUERÍA BARBERÍA</p>
<small>6 CORTES = 1 CORTE GRATIS</small>
</header>
<section class="card" id="login">
<h2>Acceso administrador</h2>
<input id="email" type="email" placeholder="Correo electrónico">
<input id="password" type="password" placeholder="Contraseña">
<button onclick="login()">ENTRAR</button>
<p id="message"></p>
</section>
<main id="app" class="hidden">
<div class="card">
<h2>Nuevo cliente</h2>
<input id="name" placeholder="Nombre completo">
<input id="phone" placeholder="Teléfono">
<button onclick="addCustomer()">AÑADIR CLIENTE</button>
<p id="addMessage"></p>
</div>
<div class="card">
<h2>📷 Escanear QR</h2>
<p>Escanea el código QR del cliente para encontrar su tarjeta.</p>
<button onclick="startScanner()">ABRIR CÁMARA</button>
<button class="secondary" onclick="stopScanner()">CERRAR CÁMARA</button>
<div id="reader"></div>
<div id="scanResult"></div>
</div>
<div class="card">
<h2>Clientes</h2>
<button onclick="loadCustomers()">ACTUALIZAR</button>
<div id="customers">Cargando...</div>
</div>

CERRAR SESIÓN

</main>
